<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Predictor</title>
    <style>
        * { box-sizing: border-box; }
        :root { --primary: #ffffff; }
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; justify-content: center; min-height: 100vh; background-image: url('https://media.tenor.com/69TGJF8dxZIAAAAM/fondo-de-pantalla.gif'); background-size: cover; background-position: center; }
        .main-container { width: 100%; max-width: 470px; min-height: 100vh; background: rgba(0, 0, 0, 0); display: none; flex-direction: column; }
        .app-header { background: var(--primary); padding: 15px; color: red; text-align: center; font-weight: bold; border-radius: 0 0 12px 12px; }
        .content { flex: 1; padding: 5px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        #history-bar { display: flex; gap: 5px; margin-bottom: 10px; width: 100%; justify-content: center; }
        .hist-box { width: 40px; height: 25px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #000; border: 1px solid #000; }
        
        .casino-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 400px; margin: 0 auto; }
        .casino-btn { aspect-ratio: 1 / 1; border: 2px solid #000; border-radius: 12px; cursor: pointer; background: #ffffff; padding: 5px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .casino-btn.selected { border-color: #FF0000; transform: scale(1.05); }
        .casino-btn img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

        .next-btn { background: #FF0000; color: #000; border: none; padding: 15px; width: 100%; max-width: 400px; border-radius: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .gif-wrapper { position: relative; display: inline-block; width: 100%; overflow: hidden; border-radius: 12px; border: 2px solid #FF0000; }
        .lightning-active::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            animation: rayo-interno 0.5s linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes rayo-interno {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #analysis-box { width: 100%; max-width: 400px; text-align: center; }
        #analysis-gif { width: 100%; height: auto; max-height: 180px; display: block; border-radius: 8px; }
        #analysis-log { width: 100%; background: #FF0000; color: black; padding: 10px; border-radius: 12px; font-weight: bold; margin-top: 5px; }

        #login-screen { position: fixed; inset: 0; background: rgba(255, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .login-box { width: 100%; max-width: 350px; background: pink; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 2px solid #000; font-size: 16px; outline: none; background: #fff; }
        
        .color-azul { color: #00bfff; }
        .color-morado { color: #bc13fe; }
        .color-rosa { color: #ff007f; }
        #result-display { font-size: 50px; font-weight: 900; margin: 10px 0; color: white; }
        
        .btn-amarillo { background: linear-gradient(to bottom, #F5CF27, #000); color: #FF0000; border: none; padding: 15px; width: 100%; max-width: 400px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(245, 207, 39, 0.4); text-transform: uppercase; }
        .btn-amarillo:disabled { background: #750000; color: #555; border: 2px solid #FF0000; box-shadow: none; cursor: not-allowed; border-radius: 12px; }
        
        .btn-salir { background: transparent; color: #FF0000; border: 2px solid #FF0000; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; width: 100%; }
        .app-header { font-weight: bold; letter-spacing: 2px; padding: 15px; opacity: 0; animation: fadeInSlide 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeInSlide { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
  
        /* --- ESTILOS ROBUSTOS PARA EL MODAL Y ANIMACIÓN DE CARGA --- */
        #modal-telegram-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #modal-telegram-overlay.activo {
            display: flex;
            opacity: 1;
            visibility: visible;
        }
        .modal-telegram-box {
            background: #ffffff;
            width: 92%;
            max-width: 360px;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            font-family: sans-serif;
            position: relative;
            animation: escalaModal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes escalaModal {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-telegram-box h3 {
            margin-top: 0;
            color: #222;
            font-size: 22px;
            font-weight: 800;
        }
        .modal-telegram-box p {
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .input-telegram, .select-telegram {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        .input-telegram:focus, .select-telegram:focus {
            border-color: #0088cc;
        }
        .phone-group {
            display: flex;
            gap: 6px;
            margin: 6px 0;
        }
        .phone-group select {
            flex: 0 0 110px;
            border-radius: 12px;
        }
        .phone-group input {
            flex: 1;
            margin: 0;
            border-radius: 12px;
        }
        .btn-telegram-popup {
            background: #0088cc;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-telegram-popup:hover {
            background: #006699;
        }
        .btn-cerrar-popup {
            background: transparent;
            border: none;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
            font-weight: bold;
            border-radius: 12px;
            padding: 5px;
        }
        .btn-cerrar-popup:hover {
            color: #333;
        }

        /* --- ANIMACIÓN DE CARGA (SPINNER) --- */
        #loading-spinner-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-weight: bold;
            color: #0088cc;
            font-size: 15px;
        }

        /* --- ESTILOS PARA LA ALERTA GENERAL CENTRADA --- */
        #custom-alert-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #custom-alert-overlay.activo {
            opacity: 1;
            visibility: visible;
        }
        .custom-alert-box {
            background: #ffffff;
            width: 90%;
            max-width: 320px;
            padding: 25px 20px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            font-family: sans-serif;
            animation: escalaAlertaPersonalizada 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes escalaAlertaPersonalizada {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .custom-alert-icon {
            font-size: 45px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .custom-alert-title {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }
        .custom-alert-message {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .custom-alert-actions {
            display: flex;
            gap: 10px;
        }
        .custom-alert-btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 15px;
            flex: 1;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-alert-btn:hover {
            background: #006699;
        }
        .custom-alert-btn-secondary {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 15px;
            flex: 1;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-alert-btn-secondary:hover {
            background: #cccccc;
        }

.btn-banco {

    border-radius: 12px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.2s;
}

.btn-banco:active {
    transform: scale(0.95);
    border-color: #FF0000;
}

.btn-banco img {
    width: 38px;
    height: 38px;
    margin-bottom: 4px;
}

.btn-banco span {

    color: #222222;
    text-align: center;
}

/* CAJA DE DATOS */
.card-datos-cuenta {
    background: #f1f5f9;
    border-left: 4px solid #FF0000;
    padding: 12px 15px;
    border-radius: 8px;
    text-align: left;
    margin-bottom: 15px;
}

.dato-row {
    font-size: 13px;
    color: #333333;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

.dato-row strong {
    color: #000000;
}

.upload-container {
    margin-bottom: 15px;
}

.btn-subir-foto {
    background: #2563eb;
    color: #ffffff;
    padding: 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.btn-subir-foto img {
    width: 22px;
    height: 22px;
}

.btn-confirmar-envio {
    background: #FF0000;
    color: #ffffff;

    border-radius: 10px;

    font-size: 15px;

}

.btn-volver-bancos {
    background: transparent;
    border: none;

    margin-top: 10px;
    cursor: pointer;
    text-decoration: underline;
}
   /* Estilo base para el botón y su SVG */
.next-btn {

.next-btn svg {

}
